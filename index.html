<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin Desktop</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #fafaf8; color: #2c2c2c; }
    #losos button, #losos [role="tab"], #losos a, #losos span:not(.htfu-badge), #losos div { color: #2c2c2c !important; }
  </style>
</head>
<body>

<script id="data" type="application/ld+json">
{
  "@context": { "schema": "https://schema.org/" },
  "@id": "#this",
  "@type": "schema:Action",
  "schema:name": "Bitcoin Desktop"
}
</script>

<script type="module" data-pane src="panes/node-pane.js"></script>
<script type="module" data-pane src="panes/settings-pane.js"></script>

<div id="losos"></div>
<script type="module" src="https://linkedobjects.github.io/losos/packages/shell/index.js"></script>

<script type="module">
  // Bootstrap the app and expose globally for panes
  import { BitcoinDesktop } from './js/app.js'
  import { mergeConfig, DEFAULTS, RECIPES, computeScore } from './js/config.js'
  import { Storage } from './js/storage.js'

  const params = new URLSearchParams(window.location.search)
  const chain = params.get('chain') || 'btc'

  // Load saved config
  const configStorage = new Storage(chain)
  let savedConfig = {}
  try {
    await configStorage.init()
    savedConfig = await configStorage.loadConfig() || {}
  } catch {}

  const config = mergeConfig(savedConfig)

  window._btc = {
    chain,
    config,
    configStorage,
    app: null,
    BitcoinDesktop,
    mergeConfig,
    DEFAULTS,
    RECIPES,
    computeScore,
  }
</script>

</body>
</html>
